version: 2

models:
  - name: raw_prontuario_vitai_dtw_fat_diagnostico
    description: >
      Registros de diagnósticos de pacientes provenientes do sistema Vitai DTW.
      Contém o CID associado ao atendimento, tipo de diagnóstico e dados de
      identificação do paciente e estabelecimento.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [diagnostico_gid]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: data_diagnostico
        description: Data e hora em que o diagnóstico foi registrado.
        data_type: datetime

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: datetime

      - name: diagnostico_gid
        description: Identificador global único do diagnóstico.
        data_type: string
        data_tests:
          - not_null

      - name: tpd_id
        description: Identificador do tipo de diagnóstico.
        data_type: int64

      - name: paciente_gid
        description: Identificador global do paciente.
        data_type: string

      - name: fat_paciente_rede_id
        description: Identificador do paciente na rede Vitai.
        data_type: int64

      - name: cid_id
        description: Identificador do CID (Classificação Internacional de Doenças).
        data_type: int64

      - name: boletim_gid
        description: Identificador global do boletim de atendimento associado.
        data_type: string

      - name: estabelecimento_gid
        description: Identificador global do estabelecimento de saúde.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: datetime

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

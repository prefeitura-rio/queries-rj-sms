version: 2

models:
  - name: raw_prontuario_vitai_dtw_fat_alergia
    description: >
      Registros de alergias de pacientes provenientes do sistema Vitai DTW.
      Contém informações sobre alergias registradas, incluindo reações, severidade
      e dados de controle temporal.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [alergia_gid]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: fat_paciente_rede_id
        description: Identificador do paciente na rede Vitai.
        data_type: int64

      - name: data_especifica
        description: Data específica associada ao registro de alergia.
        data_type: date

      - name: boletim_gid
        description: Identificador global do boletim de atendimento associado.
        data_type: string

      - name: ativo
        description: Indicador se o registro de alergia está ativo.
        data_type: string

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: datetime

      - name: tal_id
        description: Identificador do tipo de alergia.
        data_type: int64

      - name: data_registro
        description: Data e hora do registro da alergia.
        data_type: datetime

      - name: alergia_gid
        description: Identificador global único do registro de alergia.
        data_type: string
        data_tests:
          - not_null

      - name: reacao
        description: Descrição da reação alérgica do paciente.
        data_type: string

      - name: sev_id
        description: Identificador da severidade da alergia.
        data_type: int64

      - name: observacao
        description: Observações adicionais sobre a alergia.
        data_type: string

      - name: paciente_gid
        description: Identificador global do paciente.
        data_type: string

      - name: data_inclusao
        description: Data e hora de inclusão do registro de alergia.
        data_type: datetime

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: datetime

      - name: estabelecimento_gid
        description: Identificador global do estabelecimento de saúde.
        data_type: string

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

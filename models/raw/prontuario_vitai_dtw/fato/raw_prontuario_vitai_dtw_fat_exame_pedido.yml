version: 2

models:
  - name: raw_prontuario_vitai_dtw_fat_exame_pedido
    description: >
      Pedidos de exame provenientes do sistema Vitai DTW.
      Representa a solicitação de exames laboratoriais/complementares associada
      a um boletim de atendimento, contendo dados do profissional solicitante,
      tipo de exame e data do pedido.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [pedido_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: pedido_id
        description: Identificador único do pedido de exame.
        data_type: int64
        data_tests:
          - not_null

      - name: tex_id
        description: Identificador do tipo de exame solicitado.
        data_type: int64

      - name: data_pedido
        description: Data e hora em que o pedido de exame foi realizado.
        data_type: datetime

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: datetime

      - name: prf_id
        description: Identificador do profissional de saúde que solicitou o exame.
        data_type: int64

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: datetime

      - name: exame_id
        description: Identificador do exame solicitado.
        data_type: int64

      - name: paciente_gid
        description: Identificador global do paciente.
        data_type: string

      - name: estabelecimento_gid
        description: Identificador global do estabelecimento de saúde.
        data_type: string

      - name: boletim_gid
        description: Identificador global do boletim de atendimento associado.
        data_type: string

      - name: sk_data_pedido
        description: Surrogate key da data do pedido (formato YYYYMMDD).
        data_type: int64

      - name: fat_paciente_rede_id
        description: Identificador do paciente na rede Vitai.
        data_type: int64

      - name: spe_id
        description: Identificador da situação/status do pedido de exame.
        data_type: int64

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

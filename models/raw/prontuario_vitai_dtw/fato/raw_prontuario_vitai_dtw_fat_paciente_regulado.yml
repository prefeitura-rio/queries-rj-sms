version: 2

models:
  - name: raw_prontuario_vitai_dtw_fat_paciente_regulado
    description: >
      Registros de pacientes regulados provenientes do sistema Vitai DTW.
      Contém informações sobre a regulação de pacientes para outras unidades
      de saúde, incluindo dados do protocolo de regulação, unidade de destino,
      especialidade e sistema de regulação utilizado.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [paciente_regulado_gid]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: unidade_destino
        description: Nome da unidade de saúde de destino da regulação.
        data_type: string

      - name: paciente_gid
        description: Identificador global do paciente.
        data_type: string

      - name: prf_id
        description: Identificador do profissional de saúde que realizou a regulação.
        data_type: int64

      - name: data_regulacao
        description: Data em que a regulação foi realizada.
        data_type: string

      - name: data_exclusao
        description: Data em que o registro de regulação foi excluído, quando aplicável.
        data_type: string

      - name: paciente_regulado_gid
        description: Identificador global único do registro de paciente regulado.
        data_type: string
        data_tests:
          - not_null

      - name: estabelecimento_gid
        description: Identificador global do estabelecimento de saúde de origem.
        data_type: string

      - name: fat_paciente_rede_id
        description: Identificador do paciente na rede Vitai.
        data_type: int64

      - name: boletim_gid
        description: Identificador global do boletim de atendimento associado.
        data_type: string

      - name: data_cadastro
        description: Data e hora de cadastro do registro de regulação.
        data_type: datetime

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: datetime

      - name: sec_id
        description: Identificador do setor/serviço de destino da regulação.
        data_type: int64

      - name: protocolo_regulacao
        description: Número do protocolo gerado no sistema de regulação.
        data_type: string

      - name: sistema_regulacao
        description: Nome ou identificador do sistema de regulação utilizado.
        data_type: string

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: datetime

      - name: esp_id
        description: Identificador da especialidade solicitada na regulação.
        data_type: int64

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

version: 2

models:
  - name: raw_prontuario_vitai_dtw_fat_classificacao
    description: >
      Registros de classificação de risco (triagem) de pacientes provenientes do
      sistema Vitai DTW. Contém dados da avaliação de risco realizada na chegada
      do paciente ao estabelecimento, incluindo queixa principal, descritor e
      nível de risco classificado.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [classificacao_gid]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: data_fim
        description: Data e hora de encerramento da classificação de risco.
        data_type: datetime

      - name: meta
        description: Tempo meta definido para o nível de risco classificado (em minutos).
        data_type: int64

      - name: descritor
        description: Descritor clínico utilizado na classificação de risco.
        data_type: string

      - name: primeira
        description: Indicador se é a primeira classificação do boletim.
        data_type: string

      - name: asv_queixa_principal
        description: Queixa principal registrada na classificação de risco.
        data_type: string

      - name: prf_id
        description: Identificador do profissional de saúde que realizou a classificação.
        data_type: int64

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: datetime

      - name: classificacao_gid
        description: Identificador global único do registro de classificação de risco.
        data_type: string
        data_tests:
          - not_null

      - name: estabelecimento_gid
        description: Identificador global do estabelecimento de saúde.
        data_type: string

      - name: data_inicio
        description: Data e hora de início da classificação de risco.
        data_type: datetime

      - name: ultima
        description: Indicador se é a última classificação do boletim.
        data_type: string

      - name: fat_paciente_rede_id
        description: Identificador do paciente na rede Vitai.
        data_type: int64

      - name: paciente_gid
        description: Identificador global do paciente.
        data_type: string

      - name: ris_id
        description: Identificador do nível de risco classificado.
        data_type: int64

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: datetime

      - name: boletim_gid
        description: Identificador global do boletim de atendimento associado.
        data_type: string

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

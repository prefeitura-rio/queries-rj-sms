version: 2

models:
  - name: raw_prontuario_vitai_dtw_fat_item_prescricao
    description: >
      Itens de prescrição médica provenientes do sistema Vitai DTW.
      Representa cada medicamento ou procedimento prescrito dentro de uma
      prescrição, incluindo quantidade, via de administração, orientações
      de uso e indicação de antibiótico.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [item_prescricao_gid]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: item_prescrito
        description: Nome ou descrição do item prescrito (medicamento ou procedimento).
        data_type: string

      - name: item_prescricao_gid
        description: Identificador global único do item de prescrição.
        data_type: string
        data_tests:
          - not_null

      - name: observacao
        description: Observações adicionais sobre o item prescrito.
        data_type: string

      - name: is_antibiotico
        description: Indicador se o item prescrito é um antibiótico.
        data_type: string

      - name: tip_id
        description: Identificador do tipo de item prescrito.
        data_type: int64

      - name: via_id
        description: Identificador da via de administração do medicamento.
        data_type: int64

      - name: quantidade
        description: Quantidade do item prescrito.
        data_type: numeric

      - name: pri_descricaoitem
        description: Descrição detalhada do item na prescrição.
        data_type: string

      - name: estabelecimento_gid
        description: Identificador global do estabelecimento de saúde.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: datetime

      - name: boletim_gid
        description: Identificador global do boletim de atendimento associado.
        data_type: string

      - name: orientacao_uso
        description: Orientações de uso do medicamento prescrito.
        data_type: string

      - name: unm_id
        description: Identificador da unidade de medida do item prescrito.
        data_type: int64

      - name: datahora_cadastro
        description: Data e hora de cadastro do item na prescrição.
        data_type: datetime

      - name: produto_associado
        description: Produto associado ao item prescrito (equivalente terapêutico ou substituto).
        data_type: string

      - name: prescricao_gid
        description: Identificador global da prescrição à qual este item pertence.
        data_type: string

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: datetime

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

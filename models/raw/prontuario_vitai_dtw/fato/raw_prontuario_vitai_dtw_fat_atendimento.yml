version: 2

models:
  - name: raw_prontuario_vitai_dtw_fat_atendimento
    description: >
      Registros de atendimentos realizados nos estabelecimentos de saúde,
      provenientes do sistema Vitai DTW. Contém informações sobre o atendimento,
      profissional responsável, especialidade, diagnóstico e dados temporais.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [atendimento_gid]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: queixa
        description: Queixa principal do paciente no atendimento.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: datetime

      - name: matd_id
        description: Identificador do motivo de atendimento.
        data_type: int64

      - name: paciente_gid
        description: Identificador global do paciente.
        data_type: string

      - name: data_fim
        description: Data e hora de encerramento do atendimento.
        data_type: datetime

      - name: cid_id
        description: Identificador do CID (Classificação Internacional de Doenças) associado.
        data_type: int64

      - name: boletim_gid
        description: Identificador global do boletim de atendimento associado.
        data_type: string

      - name: data_inicio
        description: Data e hora de início do atendimento.
        data_type: datetime

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: datetime

      - name: estabelecimento_gid
        description: Identificador global do estabelecimento de saúde.
        data_type: string

      - name: primeiro_atendimento
        description: Indicador se é o primeiro atendimento do paciente.
        data_type: string

      - name: fat_paciente_rede_id
        description: Identificador do paciente na rede Vitai.
        data_type: int64

      - name: atendimento_gid
        description: Identificador global único do atendimento.
        data_type: string
        data_tests:
          - not_null

      - name: esp_id
        description: Identificador da especialidade médica do atendimento.
        data_type: int64

      - name: prf_id
        description: Identificador do profissional de saúde responsável.
        data_type: int64

      - name: ultimo_atendimento
        description: Indicador se é o último atendimento registrado para o paciente.
        data_type: string

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

version: 2

models:
  - name: raw_prontuario_vitai_dtw_fat_prescricao
    description: >
      Registros de prescrições médicas provenientes do sistema Vitai DTW.
      Representa o cabeçalho da prescrição, associando-a ao boletim, paciente
      e profissional responsável. Os itens prescritos estão detalhados em
      fat_item_prescricao.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [prescricao_gid]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: boletim_gid
        description: Identificador global do boletim de atendimento associado.
        data_type: string

      - name: prescricao_gid
        description: Identificador global único da prescrição.
        data_type: string
        data_tests:
          - not_null

      - name: prf_id
        description: Identificador do profissional de saúde que realizou a prescrição.
        data_type: int64

      - name: data_prescricao
        description: Data e hora em que a prescrição foi realizada.
        data_type: datetime

      - name: paciente_gid
        description: Identificador global do paciente.
        data_type: string

      - name: pre_rotinaenfermagem
        description: Indicador se a prescrição inclui rotina de enfermagem.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: datetime

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: datetime

      - name: tpr_id
        description: Identificador do tipo de prescrição.
        data_type: int64

      - name: fat_paciente_rede_id
        description: Identificador do paciente na rede Vitai.
        data_type: int64

      - name: estabelecimento_gid
        description: Identificador global do estabelecimento de saúde.
        data_type: string

      - name: pre_urgencia
        description: Indicador se a prescrição é de urgência.
        data_type: string

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

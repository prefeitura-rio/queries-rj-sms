version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_municipio
    description: >
      Dimensão de municípios proveniente do sistema Vitai DTW.
      Contém os municípios brasileiros referenciados nos cadastros de
      pacientes e estabelecimentos, incluindo o estado (UF) de cada município.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [mun_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: mun_id
        description: Identificador único do município no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: mun_descricao
        description: Nome do município.
        data_type: string

      - name: mun_uf
        description: Sigla da Unidade Federativa (estado) onde o município está localizado.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

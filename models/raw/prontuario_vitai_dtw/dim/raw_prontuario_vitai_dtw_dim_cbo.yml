version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_cbo
    description: >
      Dimensão de CBO (Classificação Brasileira de Ocupações) proveniente do
      sistema Vitai DTW. Contém os códigos e descrições das ocupações dos
      profissionais de saúde registrados no sistema.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cbo_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: cbo_id
        description: Identificador único do CBO no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: cbo_codigo
        description: Código oficial da ocupação conforme a CBO.
        data_type: string

      - name: cbo_descricao
        description: Descrição da ocupação conforme a CBO.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

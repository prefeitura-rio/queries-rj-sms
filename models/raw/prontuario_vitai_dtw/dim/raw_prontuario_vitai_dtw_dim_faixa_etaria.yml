version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_faixa_etaria
    description: >
      Dimensão de faixas etárias proveniente do sistema Vitai DTW.
      Classifica os pacientes em grupos de idade com limites inferior e superior
      definidos, utilizados para fins estatísticos e de triagem.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fae_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: fae_id
        description: Identificador único da faixa etária no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: fae_descricao
        description: Descrição da faixa etária (ex: "0 a 2 anos", "60 anos ou mais").
        data_type: string

      - name: fae_idade_inicial
        description: Limite inferior da faixa etária (em anos).
        data_type: int64

      - name: fae_idade_final
        description: Limite superior da faixa etária (em anos).
        data_type: int64

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

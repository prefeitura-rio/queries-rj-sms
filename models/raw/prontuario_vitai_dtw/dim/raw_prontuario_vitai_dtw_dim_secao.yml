version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_secao
    description: >
      Dimensão de seções hospitalares proveniente do sistema Vitai DTW.
      Representa as unidades funcionais/seções internas do estabelecimento
      de saúde onde os pacientes são alocados durante o atendimento.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [sec_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: sec_id
        description: Identificador único da seção no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: secao_gid
        description: Identificador global da seção.
        data_type: string

      - name: sec_descricao
        description: Descrição/nome da seção hospitalar.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_bairro
    description: >
      Dimensão de bairros proveniente do sistema Vitai DTW.
      Contém os bairros referenciados nos endereços dos pacientes,
      associados ao respectivo município.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [bai_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: bai_id
        description: Identificador único do bairro no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: bai_descricao
        description: Nome do bairro.
        data_type: string

      - name: mun_id
        description: Identificador do município ao qual o bairro pertence.
        data_type: int64

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

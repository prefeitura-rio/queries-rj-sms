version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_risco
    description: >
      Dimensão de níveis de risco de classificação proveniente do sistema Vitai DTW.
      Representa os graus de risco utilizados na triagem de pacientes
      (ex: Protocolo de Manchester: vermelho, laranja, amarelo, verde, azul).

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ris_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: ris_id
        description: Identificador único do nível de risco no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: ris_descricao
        description: Descrição do nível de risco de triagem.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

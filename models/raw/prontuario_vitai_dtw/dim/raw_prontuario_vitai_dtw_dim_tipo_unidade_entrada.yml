version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_tipo_unidade_entrada
    description: >
      Dimensão de tipos de unidade de entrada proveniente do sistema Vitai DTW.
      Classifica o tipo de unidade pela qual o paciente ingressou no sistema
      de atendimento (ex: pronto-socorro, ambulatório, internação).

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tpu_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: tpu_id
        description: Identificador único do tipo de unidade de entrada no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: tpu_descricao
        description: Descrição do tipo de unidade de entrada.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

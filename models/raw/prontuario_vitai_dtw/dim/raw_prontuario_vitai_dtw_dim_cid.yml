version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_cid
    description: >
      Dimensão de CID (Classificação Internacional de Doenças) proveniente do
      sistema Vitai DTW. Contém os códigos e descrições dos diagnósticos utilizados
      nos atendimentos registrados no sistema.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cid_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: cid_id
        description: Identificador único do CID no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: cid_codigo
        description: Código alfanumérico do CID (ex: A00, B20.9).
        data_type: string

      - name: cid_descricao
        description: Descrição completa do diagnóstico conforme a CID.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_via_administracao
    description: >
      Dimensão de vias de administração de medicamentos proveniente do sistema Vitai DTW.
      Contém as formas de administração utilizadas nas prescrições médicas
      (ex: oral, intravenoso, intramuscular).

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [via_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: via_id
        description: Identificador único da via de administração no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: via_descricao
        description: Descrição da via de administração do medicamento.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_procedimento
    description: >
      Dimensão de procedimentos médicos proveniente do sistema Vitai DTW.
      Contém os procedimentos clínicos e cirúrgicos registrados no sistema,
      com código e descrição conforme tabela de procedimentos do estabelecimento.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [prc_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: prc_id
        description: Identificador único do procedimento no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: prc_codigo
        description: Código do procedimento (pode ser SIGTAP ou código interno).
        data_type: string

      - name: prc_descricao
        description: Descrição completa do procedimento médico.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

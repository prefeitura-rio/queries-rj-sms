version: 2

models:
  - name: raw_prontuario_vitai_dtw_dim_unidade_medida
    description: >
      Dimensão de unidades de medida proveniente do sistema Vitai DTW.
      Contém as unidades de medida utilizadas nas prescrições médicas
      (ex: mg, ml, comprimido, ampola).

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [unm_id]
          where: "data_particao = current_date('America/Sao_Paulo')"

    columns:
      - name: unm_id
        description: Identificador único da unidade de medida no sistema.
        data_type: int64
        data_tests:
          - not_null

      - name: unm_descricao
        description: Descrição da unidade de medida.
        data_type: string

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: timestamp

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: timestamp

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: ano_particao
        description: Ano da partição do dado.
        data_type: int64

      - name: mes_particao
        description: Mês da partição do dado.
        data_type: int64

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

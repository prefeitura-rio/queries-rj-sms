version: 2

models:
  - name: raw_gdb_cnes__nfces010
    description: "Tabela bruta do CNES NFCES010 / TB_TIPO_UNIDADE. Tabela auxiliar de tipos de estabelecimento/unidade, usada como referência para o campo TP_UNID_ID das unidades."
    columns:
      - name: TP_UNID_ID
        description: "Código do Tipo de Estabelecimento."

      - name: DESCRICAO
        description: "Descrição do Tipo de Estabelecimento."

      - name: DT_ATUALIZACAO_ORIGEM
        description: "Sem uso."

      - name: _source_file
        description: "Arquivo GDB de origem do registro."

      - name: _loaded_at
        description: "Timestamp de carga do registro na camada staging."

      - name: data_particao
        description: "Data de partição/competência da base CNES."
        data_tests:
          - not_null

      - name: ano_particao
        description: "Ano da partição da base CNES."

      - name: mes_particao
        description: "Mês da partição da base CNES."

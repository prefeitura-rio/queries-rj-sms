version: 2

models:
  - name: raw_gdb_cnes__lfces021
    description: "Tabela bruta do CNES LFCES021 / TB_CARGA_HORARIA_SUS. Contém os vínculos dos profissionais nos estabelecimentos, incluindo unidade, profissional, CBO, carga horária ambulatorial, hospitalar e outros vínculos."
    columns:
      - name: UNIDADE_ID
        description: "Código do Estabelecimento de Saúde."

      - name: PROF_ID
        description: "Código do Profissional de Saúde."

      - name: COD_CBO
        description: "Código Brasileiro de Ocupação."

      - name: TP_SUS_NAO_SUS
        description: "Indica se o profissional faz atendimento ao SUS. Domínios documentados: S - Sim; N - Não."

      - name: IND_VINC
        description: "Indica a vinculação, o tipo e o subtipo de vínculo do profissional com o estabelecimento de saúde."

      - name: D_TERCSIH
        description: "Sem uso."

      - name: CG_HORAAMB
        description: "Quantidade de carga horária ambulatorial."

      - name: CGHORAHOSP
        description: "Quantidade de carga horária hospitalar."

      - name: CGHORAOUTR
        description: "Quantidade de carga horária outros."

      - name: CONSELHOID
        description: "Código do órgão emissor."

      - name: N_REGISTRO
        description: "Número do registro no conselho de classe."

      - name: SG_UF_CRM
        description: "UF do CRM."

      - name: STATUS
        description: "Controle interno do registro."

      - name: STATUSMOV
        description: "Status do vínculo do profissional. Domínios documentados: 1 - Não aprovado; 2 - Consistido; 3 - Exportado."

      - name: TP_PRECEPTOR
        description: "Indica se o profissional é preceptor na equipe. Domínios documentados: 1 - Sim; 2 - Não."

      - name: TP_RESIDENTE
        description: "Indica se o profissional é residente na equipe. Domínios documentados: 1 - Sim; 2 - Não."

      - name: NU_CNPJ_DET_VINC
        description: "Número do CNPJ do empregador."

      - name: DATA_ATU
        description: "Data da última atualização do registro."

      - name: USUARIO
        description: "Último usuário que atualizou o registro."

      - name: CHKSUM
        description: "Campo de controle/checksum do CNES."

      - name: DT_ATUALIZACAO_ORIGEM
        description: "Data da primeira entrada no Banco de Produção Federal."

      - name: DT_CMTP_INICIO
        description: "Data da primeira entrada ou data do retorno no Banco de Produção Federal."

      - name: DT_CMTP_FIM
        description: "Data final de competência."

      - name: NU_SEQ_PROCESSO
        description: "Número do processo da última carga."

      - name: _source_file
        description: "Arquivo GDB de origem do registro."

      - name: _loaded_at
        description: "Timestamp de carga do registro na camada staging."

      - name: data_particao
        description: "Data de partição/competência da base CNES."
        data_tests:
          - not_null

      - name: ano_particao
        description: "Ano da partição da base CNES."

      - name: mes_particao
        description: "Mês da partição da base CNES."

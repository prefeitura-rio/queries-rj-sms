version: 2

models:
  - name: raw_prontuario_sarah_padi__procedimentos_realizados
    description: Dados referentes a procedimentos realizados em pacientes no período.
    columns:
      - name: id_atendimento
        description: Identificador do atendimento.
        data_type: string
        data_tests:
          - not_null:
              name: raw_prontuario_sarah_padi__procedimentos_realizados__id_atendimento__not_null
              config:
                severity: warn
                warn_if: ">1000"
          - unique:
              name: raw_prontuario_sarah_padi__procedimentos_realizados__id_atendimento__unique
              config:
                severity: warn
                warn_if: ">1000"

      - name: data_procedimento
        description: Data de realização do procedimento.
        data_type: date

      - name: hora_procedimento
        description: Hora de realização do procedimento.
        data_type: time

      # Dados do Paciente
      - name: paciente_nome
        description: Nome do paciente.
        data_type: string
        policy_tags:
          - '{{ var("TAG_NOME") }}'

      - name: paciente_cpf
        description: Número do CPF do paciente.
        data_type: string
        policy_tags:
          - '{{ var("TAG_CPF") }}'

      # Dados do Profissional
      - name: cargo
        description: Cargo do profissional que realizou o procedimento.
        data_type: string

      - name: profissional_id
        description: Identificador do profissional que realizou o procedimento.
        data_type: integer

      - name: nome_profissional
        description: Nome do profissional que realizou o procedimento.
        data_type: string

      - name: cpf_profissional
        description: Número do CPF do profissional que realizou o procedimento.
        data_type: string
        policy_tags:
          - '{{ var("TAG_CPF") }}'

      - name: cns_profissional
        description: Número do CNS do profissional que realizou o procedimento.
        data_type: string
        policy_tags:
          - '{{ var("TAG_CNS") }}'

      # Procedimento
      - name: procedimento
        description: Procedimento realizado no paciente.
        data_type: string

      - name: procedimento_id
        description: Identificador do procedimento realizado no paciente.
        data_type: integer

      - name: sexo
        description: Sexo do paciente.
        data_type: string

      - name: municipio_ibge
        description: Código IBGE do município do paciente.
        data_type: integer

      - name: municipio_uf
        description: Município e UF do paciente.
        data_type: string

      - name: uf
        description: Nome da UF do paciente.
        data_type: string

      - name: clinica
        description: Nome da clínica de atendimento do paciente.
        data_type: string

      - name: clinica_especialidade
        description: Nome da clínica e especialidade de atendimento do paciente.
        data_type: string

      - name: local
        description: Local de realização do procedimento.
        data_type: string

      - name: unidade
        description: Nome da unidade de atendimento do paciente.
        data_type: string

      - name: quantidade
        description: Quantidade de fatos.
        data_type: integer

      # Metadados
      - name: extracted_at
        description: Data e hora de extração do dado na origem.
        data_type: string

      - name: ano_particao
        description: Ano de particionamento do dado.
        data_type: string

      - name: mes_particao
        description: Mês de particionamento do dado.
        data_type: string

      - name: data_particao
        description: Data de particionamento do dado.
        data_type: date

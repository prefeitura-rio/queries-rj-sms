version: 2

models:
  - name: raw_prontuario_sarah_padi__prescricao_medica_itens
    description: Dados referentes a itens de prescrições médicas realizadas em pacientes no período.
    columns:
      - name: id_surrogate
        description: Chave surrogate gerada a partir dos campos identificadores da prescrição.
        data_type: string
        data_tests:
          - not_null:
              name: raw_prontuario_sarah_padi__prescricao_medica_itens__id_surrogate__not_null
              config:
                severity: warn
                warn_if: ">1000"
          - unique:
              name: raw_prontuario_sarah_padi__prescricao_medica_itens__id_surrogate__unique
              config:
                severity: warn
                warn_if: ">1000"

      - name: prescricao_data
        description: Data da realização da prescrição médica.
        data_type: date
        data_tests:
          - not_null:
              name: raw_prontuario_sarah_padi__prescricao_medica_itens__prescricao_data__not_null
              config:
                severity: warn
                warn_if: ">1000"

      - name: id_prescricao
        description: Identificador da prescrição médica.
        data_type: string
        data_tests:
          - not_null:
              name: raw_prontuario_sarah_padi__id_prescricao_medica_itens__prescricao__not_null
              config:
                severity: warn
                warn_if: ">1000"

      - name: prestador
        description: Nome do profissional responsável pela prescrição médica.
        data_type: string

      - name: paciente
        description: Nome do paciente.
        data_type: string
        policy_tags:
          - '{{ var("TAG_NOME") }}'

      - name: tipo
        description: Tipo de item prescrito.
        data_type: string

      - name: id_item
        description: Identificador do item prescrito.
        data_type: integer

      - name: item_nome
        description: Nome do item prescrito.
        data_type: string

      - name: item_quantidade
        description: Quantidade do item prescrito.
        data_type: numeric

      - name: unidade
        description: Unidade de medida do item prescrito.
        data_type: string

      - name: via_administracao_nome
        description: Nome da via de administração do item prescrito.
        data_type: string

      - name: via_administracao_sigla
        description: Sigla da via de administração do item prescrito.
        data_type: string

      - name: posologia
        description: Posologia do item prescrito.
        data_type: string

      - name: referencia
        description: Referência do item prescrito.
        data_type: integer

      - name: inicio
        description: Início da vigência do item prescrito.
        data_type: string

      - name: situacao
        description: Situação do item prescrito.
        data_type: string

      - name: aprazamento_data
        description: Data do aprazamento do item prescrito.
        data_type: date

      - name: aprazamento_hora
        description: Hora do aprazamento do item prescrito.
        data_type: time

      - name: prestador_checagem
        description: Nome do profissional responsável pela checagem da prescrição.
        data_type: string

      - name: evento_data
        description: Data do evento de checagem da prescrição.
        data_type: date

      - name: evento_hora
        description: Hora do evento de checagem da prescrição.
        data_type: time

      - name: suspenso
        description: Indicador se o item prescrito está suspenso.
        data_type: string

      - name: quantidade
        description: Quantidade de fatos.
        data_type: integer

      # Metadados
      - name: extracted_at
        description: Data e hora de extração do dado na origem.
        data_type: string

      - name: ano_particao
        description: Ano de particionamento do dado.
        data_type: string

      - name: mes_particao
        description: Mês de particionamento do dado.
        data_type: string

      - name: data_particao
        description: Data de particionamento do dado.
        data_type: date

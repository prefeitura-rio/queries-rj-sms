version: 2

models:
  - name: raw_prontuario_sarah_padi__atendimento_domiciliar_pacientes
    description: Dados referentes a pacientes em atendimento domiciliar no período.
    columns:
      - name: id_atendimento
        description: Identificador do atendimento.
        data_type: string
        data_tests:
          - not_null:
              name: raw_prontuario_sarah_padi__atendimento_domiciliar_paciente__id_atendimento__not_null
              config:
                severity: warn
                warn_if: ">1000"
          - unique:
              name: raw_prontuario_sarah_padi__atendimento_domiciliar_paciente__id_atendimento__unique
              config:
                severity: warn
                warn_if: ">1000"

      - name: registro_data
        description: Data de registro do paciente.
        data_type: date

      - name: admissao_data
        description: Data de admissão do paciente.
        data_type: date

      - name: alta_data
        description: Data da alta do paciente.
        data_type: date

      - name: alta_periodo
        description: Indicador se o paciente teve alta no período.
        data_type: string

      - name: admitido_periodo
        description: Indicador se o paciente foi admitido no período.
        data_type: string

      - name: unidade_nome
        description: Nome da unidade de atendimento do paciente.
        data_type: string

      - name: unidade_id
        description: Identificador da unidade de atendimento do paciente.
        data_type: string

      - name: transferencia_data
        description: Data da transferência do paciente.
        data_type: date

      - name: unidade_origem_nome
        description: Nome da unidade de origem do atendimento do paciente.
        data_type: string

      - name: servico_id
        description: Identificador do serviço do atendimento.
        data_type: integer

      - name: servico_tipo
        description: Nome do serviço do atendimento.
        data_type: string

      - name: rota_id
        description: Identificador da rota de atendimento.
        data_type: string

      - name: rota
        description: Nome da rota de atendimento.
        data_type: string

      # Dados do Paciente
      - name: paciente_id
        description: Identificador do paciente.
        data_type: string

      - name: paciente_cpf
        description: Número do CPF do paciente.
        data_type: string
        policy_tags:
          - '{{ var("TAG_CPF") }}'

      - name: paciente_nome
        description: Nome do paciente.
        data_type: string
        policy_tags:
          - '{{ var("TAG_NOME") }}'

      - name: paciente_sexo
        description: Sexo do paciente.
        data_type: string

      - name: paciente_raca_cor
        description: Raça/cor referenciada pelo paciente.
        data_type: string

      - name: paciente_genero_id
        description: Identificador do gênero referenciado pelo paciente.
        data_type: string

      - name: paciente_genero
        description: Gênero referenciado pelo paciente.
        data_type: string

      - name: paciente_nascimento_data
        description: Data de nascimento do paciente.
        data_type: date
        policy_tags:
          - '{{ var("TAG_DATA_NASCIMENTO") }}'

      - name: paciente_idade
        description: Idade do paciente.
        data_type: string

      - name: faixa_etaria_id
        description: Identificador da faixa etária do paciente.
        data_type: string

      - name: faixa_etaria
        description: Nome da faixa etária do paciente.
        data_type: string

      - name: cids
        description: Lista de códigos CID10 do paciente.
        data_type: string

      - name: paciente_endereco_municipio_uf
        description: Município e UF do paciente.
        data_type: string

      - name: paciente_endereco_bairro
        description: Nome do bairro do paciente.
        data_type: string

      - name: paciente_endereco
        description: Endereço do paciente.
        data_type: string
        policy_tags:
          - '{{ var("TAG_ENDERECO") }}'

      - name: contato
        description: Nome do contato com o paciente.
        data_type: string

      - name: origem_id
        description: Identificador da origem do paciente para o atendimento.
        data_type: integer

      - name: origem
        description: Origem do paciente para o atendimento.
        data_type: string

      - name: id_tipo_origem
        description: Identificador do tipo de origem do paciente.
        data_type: integer

      - name: origem_tipo
        description: Tipo de origem do paciente.
        data_type: string

      # Dados do Cuidador
      - name: cuidador
        description: Nome do cuidador.
        data_type: string

      - name: cuidador_nome
        description: Nome do cuidador.
        data_type: string
        policy_tags:
          - '{{ var("TAG_NOME") }}'

      - name: cuidador_telefone
        description: Número do telefone do cuidador.
        data_type: string
        policy_tags:
          - '{{ var("TAG_TELEFONE") }}'

      - name: cuidador_parentesco
        description: Parentesco do cuidador com o paciente.
        data_type: string

      # Atividades de Vida Diária
      - name: avd
        description: Indicador se o paciente já tem AVD.
        data_type: string

      - name: avd_periodo
        description: Indicador se a AVD realizada está no período de análise.
        data_type: string

      - name: avd_data
        description: Data da realização da AVD no paciente.
        data_type: date

      - name: avd_dias
        description: Dias decorridos do registro até a realização da AVD no paciente.
        data_type: integer

      - name: avd_elegivel
        description: Indicador se a AVD realizada resultou em elegibilidade do paciente.
        data_type: string

      - name: avd_modalidade
        description: Modalidade da elegibilidade do paciente na AVD realizada.
        data_type: string

      - name: avd_motivo
        description: Motivo da inelegibilidade do paciente na AVD realizada.
        data_type: string

      - name: avd_motivo_detalhe
        description: Detalhe do motivo da inelegibilidade do paciente na AVD realizada.
        data_type: string

      - name: avd_profissional_nome
        description: Nome do profissional responsável em realizar a AVD no paciente.
        data_type: string

      - name: avd_profissional_cargo
        description: Cargo do prestador que realizou a AVD no paciente.
        data_type: string

      # Informações de cuidado do paciente
      - name: demanda_judicial
        description: Indicador de demanda judicial do paciente.
        data_type: string

      - name: respiracao
        description: Forma de respiração do paciente.
        data_type: string

      - name: interface
        description: Tipo de interface da respiração do paciente.
        data_type: string

      - name: modo_ventilatorio
        description: Nome do modo ventilatório do paciente.
        data_type: string

      - name: dispositivo_invasivo
        description: Dispositivos invasivos no paciente.
        data_type: string

      - name: spict_br
        description: Pontuação da escala SPICT-BR para o paciente.
        data_type: integer

      - name: iaec_ad
        description: Pontuação da escala IAEC-AD do paciente.
        data_type: integer

      - name: linha_cuidado
        description: Linhas de cuidado do paciente.
        data_type: string

      - name: cuidado_paliativo
        description: Indicador se a linha de cuidado é paliativa.
        data_type: string

      - name: indice_barthel_inicial
        description: Pontuação da escala BARTHEL inicial aplicada no paciente.
        data_type: integer

      - name: indice_barthel_final
        description: Pontuação da escala BARTHEL final aplicada no paciente.
        data_type: integer

      - name: tempo
        description: Tempo de atendimento do paciente.
        data_type: integer

      - name: permanencia
        description: Quantidade de dias de permanência do paciente.
        data_type: integer

      - name: quantidade
        description: Quantidade de fatos.
        data_type: integer

      # Metadados
      - name: extracted_at
        description: Data e hora de extração do dado na origem.
        data_type: datetime

      - name: ano_particao
        description: Ano de particionamento do dado.
        data_type: integer

      - name: mes_particao
        description: Mês de particionamento do dado.
        data_type: integer

      - name: data_particao
        description: Data de particionamento do dado.
        data_type: date

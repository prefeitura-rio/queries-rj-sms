version: 2

models:
  - name: raw_prontuario_sarah_padi__atendimento_domiciliar_linhas_cuidado
    description: Dados referentes às linhas de cuidado de pacientes em atendimento domiciliar no período.
    columns:
      - name: atendimento_id
        description: Identificador do atendimento.
        data_type: string
        data_tests:
          - not_null:
              name: raw_prontuario_sarah_padi__atendimento_domiciliar_linhas_cuidado__atendimento_id__not_null
              config:
                severity: warn
                warn_if: ">1000"
          - unique:
              name: raw_prontuario_sarah_padi__atendimento_domiciliar_linhas_cuidado__atendimento_id__unique
              config:
                severity: warn
                warn_if: ">1000"

      - name: atendimento_registro
        description: Data de registro do atendimento.
        data_type: date

      - name: atendimento_admissao
        description: Data de admissão do paciente.
        data_type: date

      # Linha de Cuidado
      - name: linha_cuidado
        description: Linhas de cuidado do paciente.
        data_type: string

      - name: cuidado_paliativo
        description: Indicador se a linha de cuidado é paliativa.
        data_type: string

      - name: cids
        description: Lista de códigos CID10 do paciente.
        data_type: string

      # Serviço
      - name: unidade
        description: Nome da unidade de atendimento do paciente.
        data_type: string

      - name: unidade_id
        description: Identificador da unidade de atendimento do paciente.
        data_type: string

      - name: servico
        description: Nome do serviço do atendimento.
        data_type: string

      - name: servico_id
        description: Identificador do serviço do atendimento.
        data_type: integer

      - name: rota
        description: Nome da rota de atendimento.
        data_type: string

      - name: rota_id
        description: Identificador da rota de atendimento.
        data_type: string

      - name: bairro
        description: Nome do bairro do paciente.
        data_type: string

      # Dados do Paciente
      - name: paciente_id
        description: Identificador do paciente.
        data_type: string

      - name: paciente_cpf
        description: Número do CPF do paciente.
        data_type: string
        policy_tags:
          - '{{ var("TAG_CPF") }}'

      - name: paciente_nome
        description: Nome do paciente.
        data_type: string
        policy_tags:
          - '{{ var("TAG_NOME") }}'

      # Atividades de Vida Diária
      - name: avd
        description: Indicador se o paciente já tem AVD.
        data_type: string

      - name: avd_no_periodo
        description: Indicador se a AVD realizada está no período de análise.
        data_type: string

      - name: avd_data
        description: Data da realização da AVD no paciente.
        data_type: date

      - name: avd_elegivel
        description: Indicador se a AVD realizada resultou em elegibilidade do paciente.
        data_type: string

      - name: avd_modalidade
        description: Modalidade da elegibilidade do paciente na AVD realizada.
        data_type: string

      - name: quantidade
        description: Quantidade de fatos.
        data_type: integer

      # Metadados
      - name: extracted_at
        description: Data e hora de extração do dado na origem.
        data_type: string

      - name: ano_particao
        description: Ano de particionamento do dado.
        data_type: string

      - name: mes_particao
        description: Mês de particionamento do dado.
        data_type: string

      - name: data_particao
        description: Data de particionamento do dado.
        data_type: date

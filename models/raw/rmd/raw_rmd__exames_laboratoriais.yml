version: 2

models:
  - name: raw_rmd__exames_laboratoriais
    description: >
      Exames laboratoriais recebidos via integração com o sistema RMD (fornecedor Blessing).
      Cada registro representa um exame, com os campos do JSON da coluna `dados` extraídos
      e tipados. O campo `exame_resultado_valor` é estruturado como um array de structs
      contendo nome, valor numérico, unidade e faixas de referência.
      Granularidade: um registro por exame (id, fornecedor_id).
    columns:
      - name: id
        description: Identificador único do registro na tabela de origem.
      - name: tipo_recurso_id
        description: Identificador do tipo de recurso no sistema de ingestão.
      - name: fornecedor_id
        description: Identificador do fornecedor do dado.
      - name: fornecedor_nome
        description: Nome do fornecedor do dado (ex. Blessing).
      - name: validado
        description: Indica se o registro passou pela validação na ingestão.
      - name: erros_validacao
        description: Mensagem de erro de validação, quando houver.
      - name: recebido_em
        description: Data e hora em que o registro foi recebido pelo pipeline de ingestão.
      - name: loaded_at
        description: Data e hora em que o registro foi carregado na camada bruta (staging).
      - name: data_particao
        description: Data de particionamento mensal da tabela.

      - name: id_exame
        description: Identificador único do exame no sistema de origem (RMD).
      - name: exame_solicitacao_id
        description: Identificador da solicitação do exame.
      - name: exame_nome
        description: Nome do exame solicitado.
      - name: exame_tipo
        description: Tipo do exame (ex. BIOQUÍMICA).
      - name: exame_metodo
        description: Método utilizado na realização do exame.
      - name: exame_status
        description: Status atual do exame (ex. concluído).
      - name: exame_data
        description: Data de referência do exame.
      - name: exame_solicitacao_data_hora
        description: Data e hora da solicitação do exame.
      - name: exame_coleta_data_hora
        description: Data e hora da coleta da amostra.
      - name: exame_laudo_data_hora
        description: Data e hora de emissão do laudo do exame.

      - name: exame_resultado_classificacao
        description: Classificação do resultado do exame (ex. normal, alterado).
      - name: exame_laudo_descricao
        description: Descrição textual do laudo do exame.
      - name: exame_resultado_laudo
        description: Caminho do arquivo PDF do laudo no Google Cloud Storage.
      - name: exame_resultado_valor
        description: >
          Array de resultados do exame extraído do JSON de origem. Cada elemento contém:
          nome (nome do resultado), valor (valor numérico em float64), unidade (unidade de medida)
          e referencia (texto com as faixas de referência por faixa etária/sexo).

      - name: paciente_cpf
        description: CPF do paciente.
      - name: paciente_cns
        description: Cartão Nacional de Saúde (CNS) do paciente.
      - name: paciente_sexo
        description: Sexo do paciente.
      - name: paciente_nascimento_data
        description: Data de nascimento do paciente.
      - name: paciente_nome
        description: Nome completo do paciente.

      - name: estabelecimento_nome
        description: Nome do estabelecimento de saúde onde o exame foi realizado.

      - name: profissional_solicitante_nome
        description: Nome do profissional que solicitou o exame.
      - name: profissional_solicitante_cpf
        description: CPF do profissional solicitante.
      - name: profissional_solicitante_crm
        description: CRM do profissional solicitante.
      - name: profissional_solicitante_cbo
        description: Código CBO da especialidade do profissional solicitante.

      - name: profissional_laudista_nome
        description: Nome do profissional que assinou o laudo.
      - name: profissional_laudista_cpf
        description: CPF do profissional laudista.
      - name: profissional_laudista_cbo
        description: Código CBO da especialidade do profissional laudista.

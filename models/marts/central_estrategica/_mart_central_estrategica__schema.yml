version: 2

models:

  - name: mart__central_estrategica__areas_programaticas
    description: >
      Quantidade de pacientes cadastrados com situação ativa por Área Programática (AP).
      Granularidade: um registro por área programática distinta.

      Os pacientes são contados a partir dos registros de cadastro do Vitacare
      (raw_prontuario_vitacare_historico__cadastro), filtrando apenas cadastros
      permanentes com situação ativa. A Área Programática é resolvida via
      dim_estabelecimento a partir do CNES da unidade de saúde do cadastro.

      Fonte: raw_prontuario_vitacare_historico__cadastro + dim_estabelecimento.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - area_programatica

    columns:
      - name: area_programatica
        description: >
          Código da Área Programática (AP) da unidade de saúde, proveniente de
          dim_estabelecimento. Chave primária.
        data_type: string
        quote: true
        tests:
          - not_null
          - unique

      - name: total_pacientes_ativos
        description: >
          Quantidade de pacientes com cadastro permanente e situação ativa
          (situacao_usuario = 'Ativo') vinculados a unidades de saúde pertencentes
          a esta área programática.
        data_type: int64
        quote: true
        tests:
          - not_null

  - name: mart__central_estrategica__equipes
    description: >
      Catálogo de equipes de saúde com atividade registrada no Vitacare,
      enriquecido com metadados cadastrais provenientes de dim_equipe.
      Granularidade: um registro por equipe (INE distinto).

      O nome e o CNES da unidade são extraídos do valor mais frequente nos
      atendimentos; tipo de equipe, área programática e telefone vêm de
      dim_equipe quando o INE é localizado na dimensão.

      Fonte: raw_prontuario_vitacare__atendimento + dim_equipe.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ine

    columns:
      - name: ine
        description: Código INE (Identificador Nacional de Equipes) da equipe de saúde. Chave primária.
        data_type: string
        quote: true
        tests:
          - not_null
          - unique

      - name: nome_equipe
        description: >
          Nome da equipe. Preferência para o nome cadastrado em dim_equipe (nome_referencia);
          quando não encontrado, usa o nome mais frequente nos registros de atendimento Vitacare.
        data_type: string
        quote: true

      - name: cnes_unidade
        description: >
          Código CNES da unidade à qual a equipe está vinculada. Preferência para o CNES
          em dim_equipe; quando não encontrado, usa o CNES mais frequente nos atendimentos.
        data_type: string
        quote: true

      - name: area_programatica
        description: >
          Área Programática (AP) da unidade de saúde à qual a equipe está vinculada,
          proveniente de dim_estabelecimento. Nulo quando o CNES não está mapeado na dimensão.
        data_type: string
        quote: true

      - name: tipo_equipe
        description: Descrição do tipo de equipe conforme CNES (ex. Equipe de Saúde da Família).
        data_type: string
        quote: true

      - name: area
        description: Área de abrangência da equipe conforme cadastro CNES.
        data_type: string
        quote: true

      - name: telefone
        description: Telefone de contato da equipe, proveniente de dim_equipe.
        data_type: string
        quote: true

      - name: data_primeiro_atendimento
        description: Data do atendimento mais antigo registrado no Vitacare para essa equipe.
        data_type: date
        quote: true
        tests:
          - not_null

      - name: data_ultimo_atendimento
        description: Data do atendimento mais recente registrado no Vitacare para essa equipe.
        data_type: date
        quote: true
        tests:
          - not_null

      - name: total_atendimentos
        description: Quantidade total de atendimentos realizados pela equipe registrados no Vitacare.
        data_type: int64
        quote: true
        tests:
          - not_null

      - name: total_pacientes_ativos
        description: >
          Quantidade de pacientes com cadastro permanente e situação ativa
          (situacao_usuario = 'Ativo') vinculados a esta equipe (ine_equipe),
          proveniente de raw_prontuario_vitacare_historico__cadastro.
          Zero quando nenhum cadastro ativo está associado ao INE.
        data_type: int64
        quote: true
        tests:
          - not_null

  - name: mart__central_estrategica__unidades
    description: >
      Catálogo de unidades de saúde presentes no fluxo de regulação ou cadastradas em
      dim_estabelecimento, enriquecido com coordenadas geográficas, área programática
      e quantidade de pacientes ativos.
      Granularidade: um registro por unidade (id_cnes) distinta.

      Fonte: mart_regulacao__solicitacao + dim_estabelecimento
             + raw_prontuario_vitacare_historico__cadastro.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id_cnes

    columns:
      - name: id_cnes
        description: Código CNES da unidade de saúde. Chave primária.
        data_type: string
        quote: true
        tests:
          - not_null
          - unique

      - name: nome
        description: >
          Nome oficial da unidade conforme dim_estabelecimento (nome_acentuado).
          Quando a unidade não está cadastrada na dimensão, utiliza o nome vindo do SISREG.
        data_type: string
        quote: true

      - name: nome_sisreg
        description: Nome da unidade conforme registrado no SISREG.
        data_type: string
        quote: true

      - name: tipo_sms_simplificado
        description: Tipo simplificado da unidade conforme classificação SMS.
        data_type: string
        quote: true

      - name: area_programatica
        description: >
          Área Programática (AP) da unidade conforme dim_estabelecimento.
          Nulo quando a unidade não está mapeada na dimensão SMS.
        data_type: string
        quote: true

      - name: latitude
        description: Latitude do endereço da unidade (WGS84), proveniente de dim_estabelecimento.
        data_type: float64
        quote: true

      - name: longitude
        description: Longitude do endereço da unidade (WGS84), proveniente de dim_estabelecimento.
        data_type: float64
        quote: true

      - name: total_pacientes_ativos
        description: >
          Quantidade de pacientes com cadastro permanente e situação ativa
          (situacao_usuario = 'Ativo') vinculados a esta unidade (id_cnes),
          proveniente de raw_prontuario_vitacare_historico__cadastro.
          Zero quando nenhum cadastro ativo está associado ao CNES.
        data_type: int64
        quote: true
        tests:
          - not_null

  - name: mart__central_estrategica__regulacao_fila_historico
    description: >
      Série histórica mensal de procedimentos em fila de regulação ambulatorial.
      Granularidade: um registro por (ano_mes, procedimento_id).

      Definição de "em fila" no mês M (critério retroativo):
        Uma solicitação é contabilizada na fila de um mês M se, no último dia de M:
          1. Já havia sido criada (data_criacao <= último dia do mês).
          2. Não possuía nenhuma marcação agendada até o final do mês
             (marcacao_datahora nulo ou posterior ao fim do mês).
          3. Não estava em status terminal: detalhe_status não pertence ao conjunto
             (CANCELADO, CANCELADA, NEGADA, NEGADO).
          4. Havia sido criada há mais de 30 dias em relação ao fim do mês —
             mesmo critério de "acumulado na fila" de regulacao_procedimentos_resumo.

      Apenas linhas com acumulados_na_fila > 0 são materializadas.

      Fonte: mart_regulacao__solicitacao + mart__central_estrategica__regulacao_procedimentos.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ano_mes
            - procedimento_id

    columns:
      - name: ano_mes
        description: >
          Primeiro dia do mês de referência (ex. 2024-01-01 representa janeiro/2024).
          Partição mensal do modelo.
        data_type: date
        quote: true
        tests:
          - not_null

      - name: procedimento_id
        description: Identificador do procedimento conforme SISREG. Parte da chave primária.
        data_type: string
        quote: true
        tests:
          - not_null

      - name: procedimento_descricao
        description: >
          Descrição normalizada do procedimento, conforme padronização aplicada em
          mart_historico_clinico_app__regulacao (ex. abreviações RX, RM, TC, AVC).
        data_type: string
        quote: true
        tests:
          - not_null

      - name: grupo_codigo
        description: Código do grupo de procedimentos conforme SISREG.
        data_type: string
        quote: true

      - name: nome_grupo
        description: Descrição do grupo de procedimentos conforme SISREG.
        data_type: string
        quote: true

      - name: acumulados_na_fila
        description: >
          Quantidade de solicitações em fila no último dia do mês de referência.
          Critério: criadas há mais de 30 dias, sem marcação agendada até o fim do mês,
          e com status não terminal (não canceladas nem negadas).
        data_type: int64
        quote: true
        tests:
          - not_null

  - name: mart__central_estrategica__regulacao_procedimentos_resumo
    description: >
      Resumo por procedimento de regulação ambulatorial.
      Granularidade: um registro por procedimento_id.

      Métricas calculadas:
        - solicitacoes_criadas_30d: solicitações cuja data de criação está nos últimos 30 dias.
        - solicitacoes_marcadas_30d: solicitações com marcação agendada nos últimos 30 dias,
          independente de quando foram criadas.
        - percentual_falta_30d: proporção (%) de faltas sobre o total marcado nos últimos
          30 dias. Nulo quando nenhuma solicitação foi marcada no período.
        - acumulados_na_fila: solicitações ativas (não canceladas nem negadas) criadas há
          mais de 30 dias e sem nenhuma marcação agendada — representa o estoque de espera.

      Fonte: mart_regulacao__solicitacao + mart__central_estrategica__regulacao_procedimentos.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - procedimento_id

    columns:
      - name: procedimento_id
        description: Identificador do procedimento conforme SISREG. Chave primária.
        data_type: string
        quote: true
        tests:
          - not_null
          - unique

      - name: procedimento_descricao
        description: >
          Descrição normalizada do procedimento, conforme padronização aplicada em
          mart_historico_clinico_app__regulacao (ex. abreviações RX, RM, TC, AVC).
        data_type: string
        quote: true
        tests:
          - not_null

      - name: grupo_codigo
        description: Código do grupo de procedimentos conforme SISREG.
        data_type: string
        quote: true

      - name: nome_grupo
        description: Descrição do grupo de procedimentos conforme SISREG.
        data_type: string
        quote: true

      - name: solicitacoes_criadas_30d
        description: >
          Quantidade de solicitações cujo registro foi criado nos últimos 30 dias
          (data de criação >= current_date - 30 dias).
        data_type: int64
        quote: true
        tests:
          - not_null

      - name: solicitacoes_marcadas_30d
        description: >
          Quantidade de solicitações com marcação agendada (marcacao.datahora) para
          os últimos 30 dias, independente de quando a solicitação foi criada.
        data_type: int64
        quote: true
        tests:
          - not_null

      - name: percentual_falta_30d
        description: >
          Percentual de faltas sobre o total de solicitações marcadas nos últimos 30 dias
          (faltas_30d / solicitacoes_marcadas_30d * 100), arredondado em 1 casa decimal.
          Nulo quando nenhuma solicitação foi marcada no período (evita divisão por zero).
        data_type: float64
        quote: true

      - name: acumulados_na_fila
        description: >
          Quantidade de solicitações ativas criadas há mais de 30 dias e sem nenhuma
          marcação agendada. Representa o estoque de espera acumulado na fila.
          São excluídas solicitações com detalhe_status em: CANCELADO, CANCELADA,
          NEGADA, NEGADO.
        data_type: int64
        quote: true
        tests:
          - not_null

  - name: mart__central_estrategica__regulacao_procedimentos
    description: >
      Lista de procedimentos distintos registrados nas solicitações de regulação ambulatorial,
      com a contagem total de solicitações associadas a cada procedimento.
      Granularidade: um registro por procedimento_id.

      A descrição normalizada é extraída de mart_historico_clinico_app__regulacao
      (padronização de abreviações RX, RM, TC, AVC e filtro de privacidade).
      Em caso de múltiplas descrições para o mesmo procedimento_id, mantém a mais frequente.

      Fonte: mart_historico_clinico_app__regulacao + mart_regulacao__solicitacao.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - procedimento_id

    columns:
      - name: procedimento_id
        description: Identificador do procedimento conforme SISREG. Chave primária.
        data_type: string
        quote: true
        tests:
          - not_null
          - unique

      - name: procedimento_descricao
        description: >
          Descrição normalizada do procedimento, conforme padronização aplicada em
          mart_historico_clinico_app__regulacao (ex. abreviações RX, RM, TC, AVC).
          Corresponde à descrição mais frequente associada ao procedimento_id.
        data_type: string
        quote: true
        tests:
          - not_null

      - name: grupo_codigo
        description: Código do grupo de procedimentos conforme SISREG.
        data_type: string
        quote: true

      - name: nome_grupo
        description: Descrição do grupo de procedimentos conforme SISREG.
        data_type: string
        quote: true

      - name: total_solicitacoes
        description: Total de solicitações registradas para esse procedimento_id.
        data_type: int64
        quote: true

  - name: mart__central_estrategica__unidades
    description: >
      Tabela de unidades de saúde envolvidas no fluxo de regulação ambulatorial
      (como solicitantes e/ou executantes), enriquecida com coordenadas geográficas
      e área programática provenientes de dim_estabelecimento.
      Granularidade: um registro por unidade (id_cnes) distinta.

      Fonte: mart_regulacao__solicitacao + dim_estabelecimento.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id_cnes

    columns:
      - name: id_cnes
        description: Código CNES da unidade de saúde.
        data_type: string
        quote: true
        tests:
          - not_null
          - unique

      - name: nome
        description: >
          Nome oficial da unidade conforme dim_estabelecimento (nome_acentuado).
          Quando a unidade não está cadastrada na dimensão, utiliza o nome vindo do SISREG.
        data_type: string
        quote: true

      - name: nome_sisreg
        description: Nome da unidade conforme registrado no SISREG.
        data_type: string
        quote: true

      - name: area_programatica
        description: >
          Área Programática (AP) da unidade conforme dim_estabelecimento.
          Nulo quando a unidade não está mapeada na dimensão SMS.
        data_type: string
        quote: true

      - name: latitude
        description: Latitude do endereço da unidade (WGS84), proveniente de dim_estabelecimento.
        data_type: float64
        quote: true

      - name: longitude
        description: Longitude do endereço da unidade (WGS84), proveniente de dim_estabelecimento.
        data_type: float64
        quote: true

      - name: flag_solicitante
        description: >
          Indica se a unidade aparece como solicitante em pelo menos uma solicitação de regulação.
        data_type: bool
        quote: true

      - name: flag_executante
        description: >
          Indica se a unidade aparece como executante em pelo menos uma solicitação de regulação.
        data_type: bool
        quote: true

  - name: mart__central_estrategica__regulacao_detalhamento
    description: >
      Detalhamento das solicitações de regulação ambulatorial, uma linha por solicitação.
      Os dados de identificação do paciente são anonimizados: exibe apenas as iniciais do
      nome e a idade calculada a partir da data de nascimento.

      As datas de aprovação e marcação são extraídas do array marcacao[], considerando
      a marcação mais recente com aprovacao_datahora preenchido.

      Filtro temporal: apenas solicitações com marcação agendada nos últimos 30 dias
      (marcacao_datahora — última marcação com aprovacao_datahora preenchido). Mostra
      o que está efetivamente agendado no período para acompanhamento operacional.

      Fonte: mart_historico_clinico_app__regulacao + mart_regulacao__solicitacao
             + int_regulacao__paciente_sisreg + dim_estabelecimento.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - solicitacao_id

    columns:
      - name: solicitacao_id
        description: Identificador único da solicitação.
        data_type: string
        quote: true
        tests:
          - not_null
          - unique

      - name: paciente_iniciais
        description: >
          Iniciais do nome do paciente (ex. "J.S."), derivadas do campo nome em
          int_regulacao__paciente_sisreg. Nulo quando o paciente não é localizado.
        data_type: string
        quote: true

      - name: paciente_idade
        description: >
          Idade atual do paciente em anos completos, calculada como a diferença entre
          a data atual e a data de nascimento registrada no SISREG.
        data_type: int64
        quote: true

      - name: solicitacao_datahora
        description: Data e hora de criação da solicitação.
        data_type: datetime
        quote: true

      - name: marcacao_aprovacao_datahora
        description: >
          Data e hora em que a marcação foi aprovada pelo regulador.
          Corresponde à aprovacao_datahora da marcação mais recente com aprovação.
          Nulo quando nenhuma marcação foi aprovada.
        data_type: datetime
        quote: true

      - name: marcacao_datahora
        description: >
          Data e hora agendada para a execução do procedimento.
          Corresponde à datahora da marcação mais recente com aprovação.
          Nulo quando não há marcação agendada.
        data_type: datetime
        quote: true

      - name: classificacao_risco
        description: >
          Classificação de risco do paciente, de azul (menos urgente) a vermelho (mais urgente).
        data_type: string
        quote: true

      - name: detalhe_status
        description: Situação atual da solicitação (ex. APROVADA, NEGADA, CANCELADO).
        data_type: string
        quote: true

      - name: procedimento_descricao
        description: Descrição normalizada do procedimento solicitado.
        data_type: string
        quote: true

      - name: cnes_unidade_solicitante
        description: Código CNES da unidade que submeteu a solicitação.
        data_type: string
        quote: true

      - name: nome_unidade_solicitante
        description: >
          Nome oficial da unidade solicitante (dim_estabelecimento) ou nome SISREG
          quando não cadastrada na dimensão.
        data_type: string
        quote: true

      - name: cnes_unidade_executante
        description: Código CNES da unidade responsável pela execução do procedimento.
        data_type: string
        quote: true

      - name: nome_unidade_executante
        description: >
          Nome oficial da unidade executante (dim_estabelecimento) ou nome SISREG
          quando não cadastrada na dimensão.
        data_type: string
        quote: true

  - name: mart__central_estrategica__regulacao_fluxo
    description: >
      Fluxo de regulação entre pares de unidades solicitantes e executantes por procedimento.
      Cada linha representa uma combinação única de (procedimento_id, solicitante, executante)
      com a quantidade de solicitações que percorreram esse fluxo nos últimos 30 dias.

      Inclui coordenadas geográficas para visualização cartográfica do fluxo
      (ex. mapa de fluxo com linhas de origem/destino filtradas por procedimento).

      Filtro temporal: apenas solicitações com marcação agendada nos últimos 30 dias
      (marcacao.datahora — última marcação com datahora preenchido). Reflete os fluxos
      que produziram agendamentos efetivos no período.

      Fonte: mart_historico_clinico_app__regulacao + mart_regulacao__solicitacao
             + dim_estabelecimento.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - procedimento_id
            - cnes_solicitante
            - cnes_executante

    columns:
      - name: procedimento_id
        description: Identificador do procedimento conforme SISREG. Parte da chave primária.
        data_type: string
        quote: true
        tests:
          - not_null

      - name: procedimento_descricao
        description: >
          Descrição normalizada do procedimento, conforme padronização aplicada em
          mart_historico_clinico_app__regulacao (ex. abreviações RX, RM, TC, AVC).
        data_type: string
        quote: true

      - name: cnes_solicitante
        description: Código CNES da unidade solicitante. Parte da chave primária.
        data_type: string
        quote: true
        tests:
          - not_null

      - name: nome_unidade_solicitante
        description: >
          Nome oficial da unidade solicitante (dim_estabelecimento) ou nome SISREG
          quando não cadastrada na dimensão.
        data_type: string
        quote: true

      - name: area_programatica_solicitante
        description: Área Programática da unidade solicitante conforme dim_estabelecimento.
        data_type: string
        quote: true

      - name: latitude_solicitante
        description: Latitude do endereço da unidade solicitante (WGS84).
        data_type: float64
        quote: true

      - name: longitude_solicitante
        description: Longitude do endereço da unidade solicitante (WGS84).
        data_type: float64
        quote: true

      - name: cnes_executante
        description: Código CNES da unidade executante.
        data_type: string
        quote: true
        tests:
          - not_null

      - name: nome_unidade_executante
        description: >
          Nome oficial da unidade executante (dim_estabelecimento) ou nome SISREG
          quando não cadastrada na dimensão.
        data_type: string
        quote: true

      - name: area_programatica_executante
        description: Área Programática da unidade executante conforme dim_estabelecimento.
        data_type: string
        quote: true

      - name: latitude_executante
        description: Latitude do endereço da unidade executante (WGS84).
        data_type: float64
        quote: true

      - name: longitude_executante
        description: Longitude do endereço da unidade executante (WGS84).
        data_type: float64
        quote: true

      - name: quantidade_solicitacoes
        description: >
          Quantidade total de solicitações que percorreram o fluxo
          desse par (solicitante → executante).
        data_type: int64
        quote: true
        tests:
          - not_null

  - name: mart__central_estrategica__regulacao_indicadores_tempos
    description: >
      Indicadores de tempo no fluxo de regulação ambulatorial, agrupados por
      (procedimento, unidade solicitante, unidade executante).

      Indicadores calculados:
        - mediana_dias_solicitacao_ate_aprovacao: mediana de dias entre a criação da
          solicitação e a aprovação da marcação pelo regulador.
        - mediana_dias_aprovacao_ate_marcacao: mediana de dias entre a aprovação e
          a data/hora da marcação agendada.
        - media_dias_*: médias aritméticas dos mesmos intervalos.

      Filtro temporal: apenas solicitações com marcação agendada nos últimos 30 dias
      (marcacao.datahora — última marcação com aprovacao_datahora preenchido). Foca nos
      procedimentos que chegaram a ser efetivamente agendados no período, tornando os
      indicadores de tempo representativos do fluxo ativo.

      Apenas solicitações presentes em mart_historico_clinico_app__regulacao são
      consideradas (já filtrado por critérios de privacidade, ex. HIV).

      Fonte: mart_historico_clinico_app__regulacao + mart_regulacao__solicitacao
             + dim_estabelecimento.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - procedimento_descricao
            - cnes_solicitante
            - cnes_executante

    columns:
      - name: procedimento_descricao
        description: Descrição normalizada do procedimento solicitado.
        data_type: string
        quote: true
        tests:
          - not_null

      - name: cnes_solicitante
        description: Código CNES da unidade que submeteu a solicitação.
        data_type: string
        quote: true
        tests:
          - not_null

      - name: nome_unidade_solicitante
        description: >
          Nome oficial da unidade solicitante (dim_estabelecimento) ou nome SISREG
          quando não cadastrada na dimensão.
        data_type: string
        quote: true

      - name: area_programatica_solicitante
        description: Área Programática da unidade solicitante conforme dim_estabelecimento.
        data_type: string
        quote: true

      - name: cnes_executante
        description: Código CNES da unidade executante do procedimento.
        data_type: string
        quote: true

      - name: nome_unidade_executante
        description: >
          Nome oficial da unidade executante (dim_estabelecimento) ou nome SISREG
          quando não cadastrada na dimensão.
        data_type: string
        quote: true

      - name: area_programatica_executante
        description: Área Programática da unidade executante conforme dim_estabelecimento.
        data_type: string
        quote: true

      - name: quantidade_solicitacoes
        description: Total de solicitações no grupo (procedimento, solicitante, executante).
        data_type: int64
        quote: true
        tests:
          - not_null

      - name: quantidade_com_aprovacao
        description: >
          Número de solicitações que chegaram à etapa de aprovação da marcação
          (possuem marcacao.aprovacao_datahora preenchido).
        data_type: int64
        quote: true

      - name: quantidade_com_marcacao
        description: >
          Número de solicitações com data de marcação definida após aprovação
          (possuem tanto aprovacao_datahora quanto datahora preenchidos).
        data_type: int64
        quote: true

      - name: mediana_dias_solicitacao_ate_aprovacao
        description: >
          Mediana (percentil 50) do número de dias corridos entre a criação da solicitação
          (solicitacao_datahora) e a aprovação da marcação (marcacao.aprovacao_datahora).
          Nulo quando nenhuma solicitação do grupo possui aprovação.
        data_type: int64
        quote: true

      - name: mediana_dias_aprovacao_ate_marcacao
        description: >
          Mediana (percentil 50) do número de dias corridos entre a aprovação da marcação
          (marcacao.aprovacao_datahora) e a data agendada para o procedimento
          (marcacao.datahora). Nulo quando nenhuma solicitação do grupo possui marcação.
        data_type: int64
        quote: true

      - name: media_dias_solicitacao_ate_aprovacao
        description: >
          Média aritmética do número de dias corridos entre a criação da solicitação
          e a aprovação da marcação. Arredondada em 1 casa decimal.
        data_type: float64
        quote: true

      - name: media_dias_aprovacao_ate_marcacao
        description: >
          Média aritmética do número de dias corridos entre a aprovação da marcação
          e a data agendada para o procedimento. Arredondada em 1 casa decimal.
        data_type: float64
        quote: true

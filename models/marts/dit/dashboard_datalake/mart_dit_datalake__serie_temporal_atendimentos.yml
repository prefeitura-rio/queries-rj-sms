version: 2

models:
  - name: mart_dit_datalake__serie_temporal_atendimentos
    description: >
      Série temporal de atendimentos dos últimos 60 dias, desagregada por estabelecimento
      de saúde e dia. Considera apenas estabelecimentos Vitacare que possuem registros
      de episódios no histórico clínico unificado (`mart_historico_clinico__episodio`).
      Destinado ao acompanhamento diário do volume de atendimentos no dashboard do Datalake.
    columns:
      - name: estabelecimento_id_cnes
        description: Código CNES do estabelecimento de saúde.
        data_type: string

      - name: estabelecimento_nome
        description: Nome do estabelecimento de saúde.
        data_type: string

      - name: fornecedor_prontuario
        description: >
          Identificador do sistema de prontuário eletrônico que originou os atendimentos
          (ex. `vitacare`).
        data_type: string

      - name: data
        description: Data de referência dos atendimentos.
        data_type: date

      - name: qtd_atendimentos
        description: Quantidade de atendimentos realizados no estabelecimento na data de referência.
        data_type: int64

version: 2

models:
  - name: mart_dit_datalake__serie_temporal_ingestao_vitai
    description: >
      Monitoramento diário da latência de ingestão das tabelas de staging do sistema
      Vitai (`brutos_prontuario_vitai_staging`). Para cada tabela e dia, mede o atraso
      entre o momento em que o registro foi atualizado na fonte (`source_updated_at`) e
      o momento em que chegou ao Datalake (`datalake_loaded_at`), em segundos. Cobre
      6 tabelas de eventos: `boletim_eventos`, `alta_eventos`, `atendimento_eventos`,
      `diagnostico_eventos`, `internacao_eventos` e `paciente_eventos`. O campo
      `datalake_loaded_at` utiliza formato de timestamp com fuso horário
      (`%Y-%m-%d %H:%M:%E*S%Ez`). O modelo é incremental com particionamento mensal
      por `data_registro`.
    columns:
      - name: data_registro
        description: Data de referência da ingestão. Chave de partição do modelo.
        data_type: date

      - name: tabela
        description: Nome da tabela de staging monitorada (sem o sufixo `_eventos`).
        data_type: string

      - name: start_time
        description: Menor valor de `datalake_loaded_at` registrado para a tabela na data de referência.
        data_type: datetime

      - name: end_time
        description: Maior valor de `datalake_loaded_at` registrado para a tabela na data de referência.
        data_type: datetime

      - name: registros
        description: Quantidade de registros ingeridos para a tabela na data de referência.
        data_type: int64

      - name: min_diff
        description: Menor latência de ingestão observada na data de referência, em segundos.
        data_type: float64

      - name: media_diff
        description: Latência média de ingestão na data de referência, em segundos.
        data_type: float64

      - name: mediana_diff
        description: Latência mediana de ingestão na data de referência, em segundos.
        data_type: float64

      - name: max_diff
        description: Maior latência de ingestão observada na data de referência, em segundos.
        data_type: float64

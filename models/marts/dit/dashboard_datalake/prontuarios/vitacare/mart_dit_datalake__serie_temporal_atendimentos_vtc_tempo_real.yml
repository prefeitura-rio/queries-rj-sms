version: 2

models:
  - name: mart_dit_datalake__serie_temporal_atendimentos_vtc_tempo_real
    description: >
      Comparação de paridade entre duas fontes de dados Vitacare para os últimos 60 dias:
      a API em tempo real (`raw_prontuario_vitacare_api__acto`) e o backup histórico
      (`raw_prontuario_vitacare_historico__acto`). Para cada combinação de estabelecimento
      e dia, apresenta o volume de atendimentos de cada fonte, permitindo identificar
      divergências entre o fluxo em tempo real e o histórico consolidado. O produto
      cartesiano entre datas e estabelecimentos Vitacare garante que todos os pares
      apareçam, mesmo quando uma das fontes não possui dados para aquele dia.
    columns:
      - name: nome_limpo
        description: Nome do estabelecimento de saúde sem caracteres especiais ou abreviações.
        data_type: string

      - name: area_programatica
        description: Área Programática (AP) de saúde à qual o estabelecimento pertence.
        data_type: string

      - name: id_cnes
        description: Código CNES do estabelecimento de saúde.
        data_type: string

      - name: data
        description: Data de referência dos atendimentos.
        data_type: date

      - name: qtd_atendimentos_api
        description: >
          Quantidade de atendimentos registrados na fonte de dados em tempo real
          (`raw_prontuario_vitacare_api__acto`) para o estabelecimento na data de referência.
          Assume valor `0` quando não há registro.
        data_type: int64

      - name: qtd_atendimentos_historico
        description: >
          Quantidade de atendimentos registrados na fonte de dados histórica
          (`raw_prontuario_vitacare_historico__acto`) para o estabelecimento na data de referência.
          Assume valor `0` quando não há registro.
        data_type: int64

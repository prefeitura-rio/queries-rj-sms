version: 2

models:
  - name: mart_dit_datalake__serie_temporal_atendimentos_unidade_mv
    description: >
      Série temporal diária de atendimentos do sistema MV (HIS hospitalar) desagregada
      por estabelecimento de saúde (CNES). Para cada combinação de dia e unidade, calcula
      o total de atendimentos e a mediana móvel dos últimos 30 dias considerando apenas o
      mesmo dia da semana. O modelo é incremental com particionamento mensal por
      `data_registro` e janela de substituição ampliada (30 dias extras para o lookback
      da mediana). Inclui correção manual do nome do CER Ilha do Governador.
    columns:
      - name: data_registro
        description: Data de referência dos atendimentos. Chave de partição do modelo.
        data_type: date

      - name: cnes
        description: Código CNES do estabelecimento de saúde.
        data_type: string

      - name: nome
        description: Nome do estabelecimento de saúde.
        data_type: string

      - name: dia_semana_nome
        description: Nome do dia da semana em português (ex. `Segunda-feira`, `Sábado`).
        data_type: string

      - name: atendimentos
        description: Total de atendimentos registrados no estabelecimento na data de referência.
        data_type: int64

      - name: mediana_ultimos_30_dias
        description: >
          Mediana do total de atendimentos nos 30 dias anteriores à data de referência,
          considerando apenas registros do mesmo dia da semana para o mesmo estabelecimento.
        data_type: float64

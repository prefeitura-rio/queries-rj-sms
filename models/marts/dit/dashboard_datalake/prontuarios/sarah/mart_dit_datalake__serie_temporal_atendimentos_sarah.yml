version: 2

models:
  - name: mart_dit_datalake__serie_temporal_atendimentos_sarah
    description: >
      Série temporal diária de atendimentos da Rede SARAH agregados para toda a cidade
      do Rio de Janeiro. Os dados são provenientes de `raw_prontuario_sarah__atendimento`.
      Para cada dia, calcula o total de atendimentos e a mediana móvel dos últimos 30 dias
      considerando apenas o mesmo dia da semana. O modelo é incremental com particionamento
      mensal por `data_registro`.
    columns:
      - name: data_registro
        description: Data de referência dos atendimentos. Chave de partição do modelo.
        data_type: date

      - name: dia_semana_nome
        description: Nome do dia da semana em português (ex. `Segunda-feira`, `Sábado`).
        data_type: string

      - name: atendimentos_no_dia
        description: Total de atendimentos registrados no sistema SARAH na data de referência.
        data_type: int64

      - name: mediana_ultimos_30_dias
        description: >
          Mediana do total de atendimentos nos 30 dias anteriores à data de referência,
          considerando apenas registros do mesmo dia da semana.
        data_type: float64

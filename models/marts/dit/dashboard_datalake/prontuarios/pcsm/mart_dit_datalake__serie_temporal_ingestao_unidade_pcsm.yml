version: 2

models:
  - name: mart_dit_datalake__serie_temporal_ingestao_unidade_pcsm
    description: >
      Monitoramento diário da latência de ingestão da tabela de staging do sistema PCSM
      (Prontuário Carioca de Saúde Mental, `brutos_prontuario_carioca_saude_mental_staging`),
      desagregado por estabelecimento de saúde (CNES). Para cada unidade e dia, mede o atraso
      entre o momento em que o registro foi atualizado na fonte (`dtentrada`) e o momento em que
      chegou ao Datalake (`_airbyte_extracted_at`), em segundos. Cobre a tabela `gh_atendimentos`.
      O modelo é incremental com particionamento mensal por `data_registro` e janela de substituição
      dos últimos 7 dias.
    columns:
      - name: data_registro
        description: Data de referência da ingestão. Chave de partição do modelo.
        data_type: date

      - name: tabela
        description: Nome da tabela de staging monitorada.
        data_type: string

      - name: cnes
        description: Código CNES do estabelecimento de saúde.
        data_type: string

      - name: nome
        description: Nome do estabelecimento de saúde.
        data_type: string

      - name: start_time
        description: Menor valor de `_airbyte_extracted_at` registrado para a unidade na data de referência.
        data_type: datetime

      - name: end_time
        description: Maior valor de `_airbyte_extracted_at` registrado para a unidade na data de referência.
        data_type: datetime

      - name: registros
        description: Quantidade de registros ingeridos para a unidade na data de referência.
        data_type: int64

      - name: min_diff
        description: Menor latência de ingestão observada na data de referência, em segundos.
        data_type: float64

      - name: media_diff
        description: Latência média de ingestão na data de referência, em segundos.
        data_type: float64

      - name: mediana_diff
        description: Latência mediana de ingestão na data de referência, em segundos.
        data_type: float64

      - name: max_diff
        description: Maior latência de ingestão observada na data de referência, em segundos.
        data_type: float64

version: 2

models:
  - name: mart_teleconsulta_consultas
    description: >
      Tabela contendo informações consolidadas sobre agendamentos e atendimentos
      realizados na rede de saúde. Inclui dados demográficos do paciente,
      informações da unidade, profissional, horários do atendimento e registros
      complementares de avaliação e evolução. Uma linha representa um agendamento
      ou atendimento individual.

    columns:
      - name: area_programatica
        description: Área Programática (AP) à qual a unidade de saúde pertence.
        data_type: string
        quote: true

      - name: nome_limpo
        description: Nome padronizado da unidade de saúde onde o atendimento foi agendado ou executado.
        data_type: string
        quote: true

      - name: id_cnes
        description: Código CNES da unidade em que o atendimento foi agendado ou executado.
        data_type: string
        quote: true

      - name: mes_ano_nascimento
        description: Data de nascimento do paciente com granularidade restrita a mês e ano, no formato YYYY-MM, para preservar a privacidade.
        data_type: string
        quote: true

      - name: sexo
        description: Sexo do paciente conforme cadastro.
        data_type: string
        quote: true

      - name: raca_cor
        description: Raça/Cor informada pelo paciente ou registrada na unidade de saúde.
        data_type: string
        quote: true

      - name: bairro_residencia
        description: Bairro de residência do paciente conforme cadastro.
        data_type: string
        quote: true

      - name: id_unidade_referencia
        description: Código CNES da unidade de referência do paciente, quando aplicável.
        data_type: string
        quote: true

      - name: equipe
        description: Nome da equipe de Saúde da Família ou equipe assistencial responsável.
        data_type: string
        quote: true

      - name: ine_equipe
        description: Código INE da equipe responsável pelo atendimento.
        data_type: string
        quote: true

      - name: profissional_nome
        description: Nome do profissional responsável pelo atendimento.
        data_type: string
        quote: true

      - name: profissional_cbo
        description: Código CBO (Classificação Brasileira de Ocupações) do profissional responsável pelo atendimento.
        data_type: string
        quote: true

      - name: profissional_cbo_descricao
        description: Descrição da ocupação do profissional conforme tabela CBO.
        data_type: string
        quote: true

      - name: profissional_equipe_nome
        description: Nome da equipe à qual o profissional está vinculado.
        data_type: string
        quote: true

      - name: profissional_equipe_cod_ine
        description: Código INE da equipe à qual o profissional está vinculado.
        data_type: string
        quote: true

      - name: tipo_consulta
        description: Tipo de consulta realizada, conforme categorização do sistema (ex. consulta de rotina, retorno, urgência).
        data_type: string
        quote: true

      - name: dthr_marcacao
        description: Timestamp de agendamento do atendimento.
        data_type: datetime
        quote: true

      - name: dthr_inicio_atendimento
        description: Timestamp de início do atendimento.
        data_type: datetime
        quote: true

      - name: dthr_fim_atendimento
        description: Timestamp de término do atendimento.
        data_type: datetime
        quote: true

      - name: estado_marcacao
        description: Estado atual da marcação (Executado, Faltou, Cancelado pelo Paciente, Cancelado pelo Profissional, etc.).
        data_type: string
        quote: true

      - name: eh_coleta
        description: Indicador se o atendimento corresponde a uma coleta de exames.
        data_type: string
        quote: true

      - name: condicoes_ativas
        description: >
          Lista de condições ativas do paciente associadas ao atendimento,
          conforme registros da unidade. Campo do tipo array de strings.
        data_type: string
        quote: true

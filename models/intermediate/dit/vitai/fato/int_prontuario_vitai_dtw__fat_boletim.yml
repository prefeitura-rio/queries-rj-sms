version: 2

models:
  - name: int_prontuario_vitai_dtw__fat_boletim
    description: >
      Boletins de atendimento do sistema Vitai DTW enriquecidos com dados do paciente
      e descrições das dimensões (especialidade, CBO, tipo de atendimento, tipo de entrada,
      tipo de unidade de entrada, prioridade, risco e faixa etária). Uma linha por boletim.

    columns:
      - name: boletim_gid
        description: Identificador global único do boletim de atendimento.
        data_type: string
        data_tests:
          - unique
          - not_null

      - name: fat_paciente_rede_id
        description: Identificador do paciente na rede Vitai (FK fat_paciente_rede).
        data_type: int64
        data_tests:
          - not_null

      - name: estabelecimento_gid
        description: Identificador global do estabelecimento de saúde.
        data_type: string

      - name: esp_id
        description: Identificador da especialidade médica (FK dim_especialidade).
        data_type: int64

      - name: cbo_id
        description: Identificador do CBO do profissional (FK dim_cbo).
        data_type: int64

      - name: tpa_id
        description: Identificador do tipo de atendimento (FK dim_tipo_atendimento).
        data_type: int64

      - name: tpe_id
        description: Identificador do tipo de entrada (FK dim_tipo_entrada).
        data_type: int64

      - name: tpu_id
        description: Identificador do tipo de unidade de entrada (FK dim_tipo_unidade_entrada).
        data_type: int64

      - name: pri_id
        description: Identificador da prioridade do atendimento (FK dim_prioridade).
        data_type: int64

      - name: ris_id
        description: Identificador do risco/triagem (FK dim_risco).
        data_type: int64

      - name: fae_id
        description: Identificador da faixa etária (FK dim_faixa_etaria).
        data_type: int64

      - name: dea_id
        description: Identificador do desfecho do atendimento.
        data_type: int64

      - name: mob_id
        description: Identificador do motivo de busca/origem do paciente.
        data_type: int64

      - name: met_id
        description: Identificador do meio de transporte/chegada.
        data_type: int64

      - name: orp_id
        description: Identificador da origem/procedência do paciente.
        data_type: int64

      - name: numero_be
        description: Número do boletim de emergência.
        data_type: int64

      - name: idade
        description: Idade do paciente no momento do atendimento.
        data_type: int64

      - name: interno
        description: Indicador se o paciente está internado.
        data_type: string

      - name: esp_descricao
        description: Descrição da especialidade médica.
        data_type: string

      - name: cbo_codigo
        description: Código CBO do profissional.
        data_type: string

      - name: cbo_descricao
        description: Descrição do CBO do profissional.
        data_type: string

      - name: tpa_descricao
        description: Descrição do tipo de atendimento.
        data_type: string

      - name: tpe_descricao
        description: Descrição do tipo de entrada.
        data_type: string

      - name: tpu_descricao
        description: Descrição do tipo de unidade de entrada.
        data_type: string

      - name: pri_descricao
        description: Descrição da prioridade do atendimento.
        data_type: string

      - name: ris_descricao
        description: Descrição do risco/triagem do paciente.
        data_type: string

      - name: fae_descricao
        description: Descrição da faixa etária.
        data_type: string

      - name: fae_idade_inicial
        description: Idade inicial da faixa etária.
        data_type: int64

      - name: fae_idade_final
        description: Idade final da faixa etária.
        data_type: int64

      - name: paciente_gid
        description: Identificador global do paciente na origem.
        data_type: string

      - name: paciente_cpf
        description: CPF do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_CPF") }}']

      - name: paciente_cns
        description: Cartão Nacional de Saúde (CNS) do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_CNS") }}']

      - name: paciente_nome
        description: Nome completo do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_NOME") }}']

      - name: paciente_nome_alternativo
        description: Nome alternativo ou social do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_NOME") }}']

      - name: paciente_nomemae
        description: Nome da mãe do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_NOME_MAE") }}']

      - name: paciente_nomepai
        description: Nome do pai do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_NOME_PAI") }}']

      - name: paciente_data_nascimento
        description: Data de nascimento do paciente.
        data_type: date
        policy_tags: ['{{ var("TAG_DATA_NASCIMENTO") }}']

      - name: paciente_sexo
        description: Sexo biológico do paciente.
        data_type: string

      - name: paciente_transex
        description: Indicador de transexualidade do paciente.
        data_type: string

      - name: paciente_naturalidade
        description: Naturalidade do paciente.
        data_type: string

      - name: paciente_raca_id
        description: Identificador da raça/cor do paciente.
        data_type: int64

      - name: paciente_raca_descricao
        description: Descrição da raça/cor do paciente.
        data_type: string

      - name: paciente_telefone
        description: Telefone principal do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_TELEFONE") }}']

      - name: paciente_celular
        description: Celular do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_TELEFONE") }}']

      - name: paciente_telefone_extra_um
        description: Primeiro telefone adicional do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_TELEFONE") }}']

      - name: paciente_telefone_extra_dois
        description: Segundo telefone adicional do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_TELEFONE") }}']

      - name: paciente_email
        description: E-mail do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_EMAIL") }}']

      - name: paciente_cep
        description: CEP do endereço do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_ENDERECO") }}']

      - name: paciente_tipologradouro
        description: Tipo do logradouro do endereço do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_ENDERECO") }}']

      - name: paciente_nomelogradouro
        description: Nome do logradouro do endereço do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_ENDERECO") }}']

      - name: paciente_bai_id
        description: Identificador do bairro do paciente.
        data_type: int64

      - name: paciente_bai_descricao
        description: Nome do bairro do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_ENDERECO") }}']

      - name: paciente_mun_id
        description: Identificador do município do paciente.
        data_type: int64

      - name: paciente_mun_descricao
        description: Nome do município do paciente.
        data_type: string
        policy_tags: ['{{ var("TAG_ENDERECO") }}']

      - name: paciente_mun_uf
        description: UF do município do paciente.
        data_type: string

      - name: data_entrada
        description: Data e hora de entrada do paciente no estabelecimento.
        data_type: datetime

      - name: data_alta
        description: Data e hora de alta do paciente.
        data_type: datetime

      - name: data_internacao
        description: Data e hora de internação do paciente.
        data_type: datetime

      - name: datahora
        description: Data e hora de referência do boletim.
        data_type: datetime

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: datetime

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: datetime

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: data_particao
        description: Data da partição do dado.
        data_type: date

version: 2

models:
  - name: int_prontuario_vitai_dtw__fat_exame_item
    description: >
      Itens individuais de exame do sistema Vitai DTW, enriquecidos com código e
      descrição do procedimento associado. Uma linha por item de exame realizado.

    columns:
      - name: exi_id
        description: Identificador único do item de exame.
        data_type: int64
        data_tests:
          - unique
          - not_null

      - name: exame_id
        description: Identificador do pedido de exame ao qual o item pertence (FK fat_exame_pedido).
        data_type: int64
        data_tests:
          - not_null

      - name: prc_id
        description: Identificador do procedimento associado ao item de exame (FK dim_procedimento).
        data_type: int64

      - name: sie_id
        description: Identificador do status interno do item de exame.
        data_type: int64

      - name: exame_gid
        description: Identificador global único do resultado do exame.
        data_type: string

      - name: exame_mneumonico
        description: Código mnemônico do exame.
        data_type: string

      - name: exame_descricao
        description: Descrição do exame realizado.
        data_type: string
        policy_tags: ['{{ var("TAG_DADO_CLINICO") }}']

      - name: codigo_interno
        description: Código interno do item de exame.
        data_type: int64

      - name: prc_codigo
        description: Código do procedimento associado ao exame.
        data_type: string

      - name: prc_descricao
        description: Descrição do procedimento associado ao exame.
        data_type: string

      - name: data_realizacao
        description: Data e hora de realização do exame.
        data_type: datetime
        policy_tags: ['{{ var("TAG_DADO_CLINICO") }}']

      - name: data_liberacao
        description: Data e hora de liberação do resultado do exame.
        data_type: datetime

      - name: data_exclusao
        description: Data e hora de exclusão do item de exame, quando aplicável.
        data_type: datetime

      - name: created_at
        description: Data e hora de criação do registro na origem.
        data_type: datetime

      - name: updated_at
        description: Data e hora da última atualização do registro na origem.
        data_type: datetime

      - name: loaded_at
        description: Data e hora de carga no Data Lake (fuso America/Sao_Paulo).
        data_type: datetime

      - name: data_particao
        description: Data da partição do dado.
        data_type: date
